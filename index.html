<!-- EAGLE-EYE LIVE MAP ENGINE -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let satelliteLayer;
let streetLayer;
let currentLocationMarker = null;

const incidents = [
  {
    id: 1,
    type: "Armed Robbery",
    status: "New",
    lat: -25.5948,
    lng: 28.0832,
    description: "Reported armed robbery",
    time: "Just now"
  },
  {
    id: 2,
    type: "Drug Activity",
    status: "In Progress",
    lat: -25.5962,
    lng: 28.0861,
    description: "Reported suspected drug activity",
    time: "10 min ago"
  },
  {
    id: 3,
    type: "Suspicious Activity",
    status: "New",
    lat: -25.5924,
    lng: 28.0805,
    description: "Suspicious activity reported",
    time: "18 min ago"
  }
];

const colors = {
  "Armed Robbery": "#e52d2d",
  "Drug Activity": "#66c82a",
  "Suspicious Activity": "#e5aa19",
  "Vandalism": "#2e83e8",
  "Assault": "#ef8317",
  "Theft": "#e5aa19"
};

function createPin(color, icon) {
  return L.divIcon({
    className: "",
    html:
      '<div style="' +
      'width:34px;' +
      'height:34px;' +
      'border-radius:50% 50% 50% 0;' +
      'transform:rotate(-45deg);' +
      'background:' + color + ';' +
      'border:3px solid white;' +
      'box-shadow:0 3px 9px rgba(0,0,0,.5);' +
      'display:flex;' +
      'align-items:center;' +
      'justify-content:center;' +
      'color:white;' +
      'font-size:15px;' +
      'font-weight:bold;' +
      '">' +
      '<span style="transform:rotate(45deg)">' + icon + '</span>' +
      '</div>',
    iconSize: [34, 34],
    iconAnchor: [17, 34],
    popupAnchor: [0, -30]
  });
}

function incidentIcon(type) {
  let icon = "!";
  
  if (type === "Armed Robbery") icon = "⚠";
  if (type === "Drug Activity") icon = "●";
  if (type === "Suspicious Activity") icon = "?";
  if (type === "Vandalism") icon = "V";
  if (type === "Assault") icon = "A";
  if (type === "Theft") icon = "T";

  return createPin(colors[type] || "#2784e8", icon);
}

function popupContent(incident) {
  const mapsUrl =
    "https://www.google.com/maps/search/?api=1&query=" +
    incident.lat + "," + incident.lng;

  const streetViewUrl =
    "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=" +
    incident.lat + "," + incident.lng;

  return `
    <div style="min-width:220px;font-family:Arial,sans-serif">
      <h3 style="margin:0 0 8px">
        ${incident.type}
      </h3>

      <p style="margin:5px 0">
        <b>Status:</b> ${incident.status}
      </p>

      <p style="margin:5px 0">
        <b>Time:</b> ${incident.time}
      </p>

      <p style="margin:5px 0 10px">
        ${incident.description}
      </p>

      <p style="font-size:11px;margin:5px 0">
        ${incident.lat.toFixed(6)},
        ${incident.lng.toFixed(6)}
      </p>

      <a href="${mapsUrl}"
         target="_blank"
         style="display:block;
                background:#2784e8;
                color:white;
                padding:9px;
                text-align:center;
                border-radius:7px;
                text-decoration:none;
                margin-top:7px;">
        🗺️ Open in Google Maps
      </a>

      <a href="${streetViewUrl}"
         target="_blank"
         style="display:block;
                background:#182b40;
                color:white;
                padding:9px;
                text-align:center;
                border-radius:7px;
                text-decoration:none;
                margin-top:7px;">
        👁️ Street View
      </a>
    </div>
  `;
}

function addIncidentMarkers() {
  incidents.forEach(incident => {
    L.marker(
      [incident.lat, incident.lng],
      {
        icon: incidentIcon(incident.type)
      }
    )
    .addTo(map)
    .bindPopup(popupContent(incident));
  });
}

function updateDashboard() {
  const total = incidents.length;
  const newCount =
    incidents.filter(i => i.status === "New").length;

  const progressCount =
    incidents.filter(i => i.status === "In Progress").length;

  const resolvedCount =
    incidents.filter(i => i.status === "Resolved").length;

  const totalElement = document.getElementById("total");
  const newElement = document.getElementById("new");
  const progressElement = document.getElementById("progress");
  const resolvedElement = document.getElementById("resolved");

  if (totalElement) totalElement.textContent = total;
  if (newElement) newElement.textContent = newCount;
  if (progressElement) progressElement.textContent = progressCount;
  if (resolvedElement) resolvedElement.textContent = resolvedCount;

  renderIncidentList(incidents);
}

function renderIncidentList(items) {
  const list = document.getElementById("list");

  if (!list) return;

  if (!items.length) {
    list.innerHTML =
      '<p style="color:#aebbd0">No incidents found.</p>';
    return;
  }

  list.innerHTML = items.map(incident => {

    let statusClass = "new";

    if (incident.status === "In Progress") {
      statusClass = "prog";
    }

    if (incident.status === "Resolved") {
      statusClass = "done";
    }

    return `
      <button class="inc"
        onclick="focusIncident(${incident.id})">

        <div class="incicon"
             style="background:${colors[incident.type] || "#2784e8"}">
          📍
        </div>

        <div class="incmain">
          <b>${incident.type}</b>

          <small>
            ${incident.description}<br>
            ${incident.lat.toFixed(5)},
            ${incident.lng.toFixed(5)}
          </small>
        </div>

        <span class="badge ${statusClass}">
          ${incident.status}
        </span>

      </button>
    `;
  }).join("");
}

function focusIncident(id) {
  const incident =
    incidents.find(item => item.id === id);

  if (!incident) return;

  map.setView(
    [incident.lat, incident.lng],
    17,
    { animate: true }
  );

  setTimeout(() => {
    map.eachLayer(layer => {
      if (
        layer.getLatLng &&
        layer.getLatLng().lat === incident.lat &&
        layer.getLatLng().lng === incident.lng
      ) {
        layer.openPopup();
      }
    });
  }, 400);
}

function toggleSat() {
  if (!map) return;

  if (map.hasLayer(satelliteLayer)) {
    map.removeLayer(satelliteLayer);
    streetLayer.addTo(map);
  } else {
    map.removeLayer(streetLayer);
    satelliteLayer.addTo(map);
  }
}

function locateMe() {
  if (!navigator.geolocation) {
    alert("Location is not supported on this device.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      map.setView([lat, lng], 16);

      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }

      currentLocationMarker = L.circleMarker(
        [lat, lng],
        {
          radius: 9,
          color: "#ffffff",
          weight: 3,
          fillColor: "#2784e8",
          fillOpacity: 1
        }
      )
      .addTo(map)
      .bindPopup(
        "<b>Officer Location</b><br>" +
        lat.toFixed(6) + ", " +
        lng.toFixed(6)
      )
      .openPopup();

    },
    function() {
      alert(
        "Could not get your location. " +
        "Please allow location access in Chrome."
      );
    },
    {
      enableHighAccuracy: true,
      timeout: 10000
    }
  );
}

function filterType(type) {
  const filtered =
    incidents.filter(i => i.type === type);

  renderIncidentList(filtered);

  map.eachLayer(layer => {
    if (layer instanceof L.Marker) {
      map.removeLayer(layer);
    }
  });

  filtered.forEach(incident => {
    L.marker(
      [incident.lat, incident.lng],
      { icon: incidentIcon(incident.type) }
    )
    .addTo(map)
    .bindPopup(popupContent(incident));
  });
}

function resetFilters() {
  renderIncidentList(incidents);

  map.eachLayer(layer => {
    if (layer instanceof L.Marker) {
      map.removeLayer(layer);
    }
  });

  addIncidentMarkers();
}

function filters() {
  alert(
    "Incident filters are available below the map."
  );
}

/* STREET MAP */
streetLayer = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
);

/* SATELLITE MAP */
satelliteLayer = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution:
      "Tiles &copy; Esri"
  }
);

/* START MAP */
map = L.map("map", {
  zoomControl: false,
  attributionControl: true
});

/* DEFAULT LOCATION */
map.setView(
  [-25.5948, 28.0832],
  14
);

/* LOAD NORMAL MAP */
streetLayer.addTo(map);

/* ADD INCIDENT PINS */
addIncidentMarkers();

/* UPDATE DASHBOARD NUMBERS */
updateDashboard();

/* FIX MAP SIZE AFTER PAGE LOAD */
setTimeout(function() {
  map.invalidateSize();
}, 500);

window.addEventListener("resize", function() {
  if (map) {
    map.invalidateSize();
  }
});
</script>

</body>
</html>
