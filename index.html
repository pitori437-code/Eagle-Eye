<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">

<title>Eagle-Eye | Community Safety</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #07101d;
  color: #f5f7fb;
  font-family: Arial, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

header {
  background: #10203a;
  padding: 22px 15px;
  text-align: center;
  border-bottom: 2px solid #243a59;
}

.logo {
  font-size: 42px;
  font-weight: 800;
  color: #3b9cff;
}

.subtitle {
  margin-top: 6px;
  font-size: 18px;
  color: #aebbd0;
}

main {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 18px;
}

h1 {
  font-size: 30px;
  margin: 10px 0;
}

h2 {
  font-size: 25px;
}

p {
  color: #b7c4d8;
  line-height: 1.6;
  font-size: 17px;
}

.card {
  background: #10203a;
  border: 1px solid #243a59;
  border-radius: 24px;
  padding: 22px;
  margin-bottom: 18px;
}

.action {
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 18px;
  margin-top: 15px;
  color: white;
  font-weight: 800;
  font-size: 20px;
}

.report {
  background: #ef3838;
}

.location {
  background: #247fd7;
}

.emergency {
  background: #ff9f0a;
  color: white;
}

.hidden {
  display: none !important;
}

.back {
  background: #304a70;
  border: 0;
  color: white;
  border-radius: 14px;
  padding: 13px 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

#map {
  height: 440px;
  width: 100%;
  border-radius: 22px;
  overflow: hidden;
  border: 2px solid #243a59;
}

.map-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.control {
  border: 0;
  border-radius: 13px;
  padding: 14px 8px;
  background: #263e61;
  color: white;
  font-weight: 700;
}

.control.active {
  background: #2385df;
}

.location-info {
  margin-top: 15px;
  background: #0c1729;
  border-radius: 18px;
  padding: 18px;
}

.coordinates {
  color: #72c7ff;
  font-family: monospace;
  font-size: 16px;
  word-break: break-all;
}

.confirm {
  background: #16a56b;
}

.street {
  background: #6b4fd3;
}

.status {
  background: #0c1729;
  border-radius: 16px;
  padding: 15px;
  margin-top: 15px;
  color: #8ed1ff;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: #73829a;
  padding: 25px 10px 45px;
}

/* Incident marker */
.incident-marker {
  width: 42px;
  height: 42px;
  background: #e92323;
  border: 4px solid white;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 3px 12px rgba(0,0,0,.5);
}

.incident-marker::after {
  content: "!";
  display: block;
  color: white;
  font-weight: 900;
  font-size: 22px;
  text-align: center;
  line-height: 34px;
  transform: rotate(45deg);
}

@media (max-width: 500px) {
  .logo {
    font-size: 34px;
  }

  #map {
    height: 390px;
  }

  main {
    padding: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🦅 Eagle-Eye</div>
  <div class="subtitle">
    Community Safety & Incident Reporting
  </div>
</header>

<main>

  <!-- HOME -->
  <section id="home">

    <div class="card">
      <h1>Welcome to Eagle-Eye</h1>

      <p>
        Report incidents, select the exact location on a live map,
        share your location and request emergency assistance.
      </p>
    </div>

    <div class="card">
      <h2>🚨 Report an Incident</h2>

      <p>
        Tap the exact place where the incident happened.
      </p>

      <button class="action report" onclick="openIncidentMap()">
        Report
